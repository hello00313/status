name: Uptime Monitor

on:
  schedule:
    # 5분마다 실행 (GitHub 서버 사정에 따라 약 5~10분 간격 실행)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 언제든 수동 실행 가능하도록 설정

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Uptime Check (KST)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const targets = [
              { name: 'Y SERVICE (MAIN)', url: 'https://yhn.kr' },
              { name: 'BLOG', url: 'https://blog.yhn.kr' },
              { name: 'API', url: 'https://api.yhn.kr' }
            ];

            // 1. 상태 데이터 (상태.json)
            let statusData = {
              systemState: 'operational',
              lastUpdated: '',
              uptime: '100.00',
              services: [],
              history: []
            };

            // 2. 점검 데이터 (점검.json)
            let maintenanceData = [];

            // 3. 장애 데이터 (장애.json)
            let incidentsData = [];

            // 기존 JSON 파일들 로드
            if (fs.existsSync('status.json')) {
              try { statusData = JSON.parse(fs.readFileSync('status.json', 'utf8')); } catch (e) {}
            }
            if (fs.existsSync('maintenance.json')) {
              try { maintenanceData = JSON.parse(fs.readFileSync('maintenance.json', 'utf8')); } catch (e) {}
            }
            if (fs.existsSync('incidents.json')) {
              try { incidentsData = JSON.parse(fs.readFileSync('incidents.json', 'utf8')); } catch (e) {}
            }

            if (!statusData.history) statusData.history = [];

            let allOk = true;
            const now = new Date();
            
            // KST 포맷팅
            const kstFormatter = new Intl.DateTimeFormat('ko-KR', {
              timeZone: 'Asia/Seoul',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            const nowStr = kstFormatter.format(now) + ' KST';

            const currentCheck = {
              timestamp: now.toISOString(),
              services: []
            };

            for (const t of targets) {
              let isUp = false;
              try {
                const res = await fetch(t.url, { method: 'GET', signal: AbortSignal.timeout(8000) });
                if (res.status >= 200 && res.status < 400) isUp = true;
              } catch (err) {
                isUp = false;
              }

              if (!isUp) allOk = false;

              currentCheck.services.push({
                name: t.name,
                url: t.url,
                status: isUp ? 'operational' : 'outage'
              });
            }

            // 히스토리 누적 (최근 1000개)
            statusData.history.push(currentCheck);
            if (statusData.history.length > 1000) statusData.history.shift();

            // 가동률 계산
            let totalChecks = 0;
            let upChecks = 0;
            statusData.history.forEach(h => {
              h.services.forEach(s => {
                totalChecks++;
                if (s.status === 'operational') upChecks++;
              });
            });
            const uptimeRatio = totalChecks > 0 ? ((upChecks / totalChecks) * 100).toFixed(2) : '100.00';

            // 장애 감지
            const prevCheck = statusData.history.length > 1 ? statusData.history[statusData.history.length - 2] : null;
            if (prevCheck) {
              targets.forEach(t => {
                const prevStatus = prevCheck.services.find(s => s.name === t.name)?.status;
                const currStatus = currentCheck.services.find(s => s.name === t.name)?.status;

                if (prevStatus === 'operational' && currStatus === 'outage') {
                  incidentsData.unshift({
                    id: Date.now(),
                    type: 'outage',
                    service: t.name,
                    title: `${t.name} 서비스 연결 장애 발생`,
                    time: `${nowStr} ~ 진행 중`,
                    startTime: now.getTime(),
                    duration: '진행 중',
                    text: '자동 모니터링 시스템에 의해 응답 지연 또는 장애가 감지되었습니다.'
                  });
                }

                if (prevStatus === 'outage' && currStatus === 'operational') {
                  const activeInc = incidentsData.find(i => i.service === t.name && i.duration === '진행 중');
                  if (activeInc) {
                    const diffMin = Math.max(1, Math.round((now.getTime() - activeInc.startTime) / 60000));
                    activeInc.duration = `${diffMin}분 동안 발생`;
                    activeInc.time = `${activeInc.time.replace('~ 진행 중', '')} ~ ${nowStr.split(' ')[3] || ''} (${diffMin}분간)`;
                  }
                }
              });
            }

            statusData.systemState = allOk ? 'operational' : 'outage';
            statusData.uptime = uptimeRatio;
            statusData.lastUpdated = nowStr;
            statusData.services = currentCheck.services;

            // 3개의 분리된 JSON 파일로 저장
            fs.writeFileSync('status.json', JSON.stringify(statusData, null, 2));
            fs.writeFileSync('maintenance.json', JSON.stringify(maintenanceData, null, 2));
            fs.writeFileSync('incidents.json', JSON.stringify(incidentsData, null, 2));

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json maintenance.json incidents.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update system status, maintenance & incidents [KST]" && git push)
