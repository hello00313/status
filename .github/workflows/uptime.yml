name: Uptime Monitor

on:
  schedule:
    # 5분마다 실행 (GitHub 서버 사정에 따라 약 5~10분 간격 실행)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 언제든 수동 실행 가능하도록 설정

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Uptime Check (KST)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const targets = [
              { name: 'Y SERVICE (WEB)', url: 'https://yhn.kr' },
              { name: 'Y SERVICE (BLOG)', url: 'https://blog.yhn.kr' },
              { name: 'Y SERVICE (API)', url: 'https://api.yhn.kr' }
            ];

            const LATENCY_THRESHOLD_MS = 2000; // 2초 이상 지연 시 degraded 상태 처리

            // 1. 상태 데이터 (status.json)
            let statusData = {
              systemState: 'operational',
              lastUpdated: '',
              uptime: '100.00',
              services: [],
              history: []
            };

            // 2. 점검 데이터 (maintenance.json)
            let maintenanceData = [];

            // 3. 장애 데이터 (incidents.json)
            let incidentsData = [];

            // 기존 JSON 파일들 로드
            if (fs.existsSync('status.json')) {
              try { statusData = JSON.parse(fs.readFileSync('status.json', 'utf8')); } catch (e) {}
            }
            if (fs.existsSync('maintenance.json')) {
              try { maintenanceData = JSON.parse(fs.readFileSync('maintenance.json', 'utf8')); } catch (e) {}
            }
            if (fs.existsSync('incidents.json')) {
              try { incidentsData = JSON.parse(fs.readFileSync('incidents.json', 'utf8')); } catch (e) {}
            }

            if (!statusData.history) statusData.history = [];

            const now = new Date();
            const nowMs = now.getTime();
            const ONE_DAY_MS = 24 * 60 * 60 * 1000; // 24시간
            
            // KST 포맷팅
            const kstFormatter = new Intl.DateTimeFormat('ko-KR', {
              timeZone: 'Asia/Seoul',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            const nowStr = kstFormatter.format(now) + ' KST';

            const currentCheck = {
              timestamp: now.toISOString(),
              services: []
            };

            let outageCount = 0;
            let degradedCount = 0;

            for (const t of targets) {
              let status = 'outage';
              let responseTime = 0;
              const startTime = Date.now();

              try {
                const res = await fetch(t.url, { method: 'GET', signal: AbortSignal.timeout(8000) });
                responseTime = Date.now() - startTime;

                if (res.status >= 200 && res.status < 400) {
                  if (responseTime >= LATENCY_THRESHOLD_MS) {
                    status = 'degraded';
                  } else {
                    status = 'operational';
                  }
                } else {
                  status = 'outage';
                }
              } catch (err) {
                responseTime = Date.now() - startTime;
                status = 'outage';
              }

              if (status === 'outage') outageCount++;
              if (status === 'degraded') degradedCount++;

              currentCheck.services.push({
                name: t.name,
                url: t.url,
                status: status,
                latency: responseTime
              });
            }

            // 히스토리 누적 (최근 1000개)
            statusData.history.push(currentCheck);
            if (statusData.history.length > 1000) statusData.history.shift();

            // 1. 전체 가동률 계산 (operational 및 degraded 모두 정상 연결로 간주)
            let totalChecks = 0;
            let upChecks = 0;
            statusData.history.forEach(h => {
              h.services.forEach(s => {
                totalChecks++;
                if (s.status === 'operational' || s.status === 'degraded') upChecks++;
              });
            });
            const totalUptimeRatio = totalChecks > 0 ? ((upChecks / totalChecks) * 100).toFixed(2) : '100.00';

            // 2. 서버별 개별 가동률 및 서비스 데이터 구성
            const processedServices = targets.map(t => {
              let serviceTotal = 0;
              let serviceUp = 0;

              statusData.history.forEach(h => {
                const match = (h.services || []).find(s => s.name === t.name);
                if (match) {
                  serviceTotal++;
                  if (match.status === 'operational' || match.status === 'degraded') serviceUp++;
                }
              });

              const serviceUptime = serviceTotal > 0 ? ((serviceUp / serviceTotal) * 100).toFixed(2) : '100.00';
              const currentSvc = currentCheck.services.find(s => s.name === t.name);

              return {
                name: t.name,
                url: t.url,
                status: currentSvc?.status || 'operational',
                latency: currentSvc?.latency || 0,
                uptime: serviceUptime
              };
            });

            // 3. 장애 및 지연 감지 이력 생성
            const prevCheck = statusData.history.length > 1 ? statusData.history[statusData.history.length - 2] : null;
            if (prevCheck) {
              targets.forEach(t => {
                const prevStatus = prevCheck.services.find(s => s.name === t.name)?.status;
                const currStatus = currentCheck.services.find(s => s.name === t.name)?.status;

                // 정상 -> 장애
                if (prevStatus !== 'outage' && currStatus === 'outage') {
                  incidentsData.unshift({
                    id: Date.now(),
                    type: 'outage',
                    service: t.name,
                    title: `${t.name} 서비스 연결 장애 발생`,
                    time: `${nowStr} ~ 진행 중`,
                    startTime: nowMs,
                    duration: '진행 중',
                    text: '자동 모니터링 시스템에 의해 응답 중단 또는 접속 불가 상태가 감지되었습니다.'
                  });
                }

                // 정상 -> 지연
                if (prevStatus === 'operational' && currStatus === 'degraded') {
                  const currSvc = currentCheck.services.find(s => s.name === t.name);
                  incidentsData.unshift({
                    id: Date.now(),
                    type: 'outage',
                    service: t.name,
                    title: `${t.name} 응답 지연 발생`,
                    time: `${nowStr} ~ 진행 중`,
                    startTime: nowMs,
                    duration: '진행 중',
                    text: `서버 응답 시간이 기준치(${LATENCY_THRESHOLD_MS}ms)를 초과했습니다. (현재 응답 속도: ${currSvc?.latency || 0}ms)`
                  });
                }

                // 장애/지연 -> 정상 복구
                if ((prevStatus === 'outage' || prevStatus === 'degraded') && currStatus === 'operational') {
                  const activeInc = incidentsData.find(i => i.service === t.name && i.duration === '진행 중');
                  if (activeInc) {
                    const diffMin = Math.max(1, Math.round((nowMs - activeInc.startTime) / 60000));
                    activeInc.duration = `${diffMin}분 동안 발생`;
                    activeInc.time = `${activeInc.time.replace('~ 진행 중', '')} ~ ${nowStr.split(' ')[3] || ''} (${diffMin}분간)`;
                  }
                }
              });
            }

            // 4. 24시간 지난 이력 자동 삭제
            incidentsData = incidentsData.filter(inc => {
              if (!inc.startTime) return true;
              return (nowMs - inc.startTime) < ONE_DAY_MS;
            });

            // 5. 전체 시스템 상태 판단
            if (outageCount === targets.length) {
              statusData.systemState = 'outage';
            } else if (outageCount > 0) {
              statusData.systemState = 'partial_outage';
            } else if (degradedCount > 0) {
              statusData.systemState = 'degraded';
            } else {
              statusData.systemState = 'operational';
            }

            statusData.uptime = totalUptimeRatio;
            statusData.lastUpdated = nowStr;
            statusData.services = processedServices;

            // 저장
            fs.writeFileSync('status.json', JSON.stringify(statusData, null, 2));
            fs.writeFileSync('maintenance.json', JSON.stringify(maintenanceData, null, 2));
            fs.writeFileSync('incidents.json', JSON.stringify(incidentsData, null, 2));

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json maintenance.json incidents.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update status, latency & incidents [KST]" && git push)
