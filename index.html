<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y SERVICE STATUS</title>
  
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
    }
  </script>

  <style>
    /* 📌 기본(Default) 글자 크기: 100% (16px) 복원 */
    html {
      font-size: 16px;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .bar-item {
      flex: 1;
      height: 18px;
      border-radius: 4px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bar-item:hover {
      transform: scaleY(1.25);
    }

    /* ♿ 접근성 시스템: 고대비 모드 (High Contrast) */
    body.high-contrast {
      background-color: #000000 !important;
      color: #ffffff !important;
    }
    body.high-contrast header,
    body.high-contrast #status-banner,
    body.high-contrast #services-container > div,
    body.high-contrast #incidents-container > div,
    body.high-contrast #a11y-modal-content {
      background-color: #000000 !important;
      border: 2px solid #ffff00 !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    body.high-contrast h1, 
    body.high-contrast h2, 
    body.high-contrast h3, 
    body.high-contrast span, 
    body.high-contrast p, 
    body.high-contrast strong {
      color: #ffffff !important;
    }
    body.high-contrast #status-text {
      color: #ffff00 !important;
    }
    body.high-contrast button {
      border: 2px solid #ffffff !important;
      background-color: #000000 !important;
      color: #ffffff !important;
    }
    body.high-contrast button.btn-active,
    body.high-contrast button:hover {
      background-color: #ffff00 !important;
      color: #000000 !important;
      font-weight: bold !important;
    }

    /* ♿ 접근성 시스템: 큰 글씨 모드 (Large Font: 140% 비율로 확대) */
    body.large-font {
      font-size: 140% !important;
    }
    body.large-font h1 { font-size: 1.4rem !important; }
    body.large-font h2 { font-size: 1.1rem !important; }
    body.large-font .text-xs { font-size: 0.95rem !important; }
    body.large-font .text-\[11px\] { font-size: 0.88rem !important; }
    body.large-font .text-xl { font-size: 1.85rem !important; }

    /* ♿ 접근성 시스템: 애니메이션 정지 (Reduce Motion) */
    body.reduce-motion * {
      animation: none !important;
      transition: none !important;
    }

    /* ♿ 접근성 시스템: 키보드 포커스 강조 */
    body.focus-highlight *:focus-visible {
      outline: 3px solid #3b82f6 !important;
      outline-offset: 3px !important;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#090D16] text-gray-900 dark:text-gray-100 antialiased min-h-screen transition-colors duration-300 flex flex-col justify-between">

  <!-- 접근성 본문 바로가기 -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:p-4 focus:bg-gray-900 focus:text-white focus:z-50">
    본문 내용으로 바로가기
  </a>

  <div id="main-content" class="max-w-2xl mx-auto w-full px-5 py-12 flex-1">
    <!-- Header -->
    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-xl bg-gray-900 dark:bg-white text-white dark:text-gray-950 font-bold flex items-center justify-center text-sm shadow-sm" aria-hidden="true">
          Y
        </div>
        <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white">Y SERVICES STATUS</h1>
      </div>

      <div>
        <a href="https://yhn.kr" target="_blank" class="text-xs font-semibold text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-gray-200 transition-colors flex items-center gap-1">
          yhn.kr 방문 &rarr;
        </a>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="p-6 rounded-3xl border transition-all duration-300 mb-10 bg-white/70 dark:bg-[#111726]/70 border-gray-200/70 dark:border-gray-800/80 shadow-xl shadow-gray-200/20 dark:shadow-none backdrop-blur-xl" role="region" aria-label="전체 시스템 상태 정보">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="relative flex h-3 w-3" aria-hidden="true">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3"></span>
          </span>
          <span id="status-text" class="font-bold text-base tracking-tight"></span>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-gray-400 dark:text-gray-500 block font-medium">전체 가동률</span>
          <span id="uptime-percentage" class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 tracking-tight">100.0%</span>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800/60 flex justify-between items-center text-[11px] text-gray-400 dark:text-gray-500">
        <span id="last-updated">최근 점검 확인 중...</span>
      </div>
    </div>

    <!-- Services Section -->
    <section class="mb-10" aria-labelledby="services-title">
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 id="services-title" class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">서비스별 상태</h2>
      </div>
      <div id="services-container" class="space-y-4"></div>
    </section>

    <!-- Incident Log Section -->
    <section class="mb-12" aria-labelledby="incidents-title">
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 id="incidents-title" class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">점검 및 장애 이력 (최근 24시간)</h2>
        
        <div class="flex items-center p-1 bg-gray-200/50 dark:bg-gray-800/50 rounded-xl text-xs font-medium backdrop-blur-md" role="group" aria-label="이력 필터">
          <button id="filter-all" onclick="setFilter('all')" class="px-3 py-1 rounded-lg transition-all text-gray-900 dark:text-white bg-white dark:bg-gray-700 shadow-sm font-semibold">
            전체
          </button>
          <button id="filter-outage" onclick="setFilter('outage')" class="px-3 py-1 rounded-lg transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            장애
          </button>
          <button id="filter-maintenance" onclick="setFilter('maintenance')" class="px-3 py-1 rounded-lg transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            점검
          </button>
        </div>
      </div>
      <div id="incidents-container" class="space-y-3"></div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-gray-400 dark:text-gray-600 border-t border-gray-200/40 dark:border-gray-800/40">
    Made by <span class="font-semibold text-gray-500 dark:text-gray-400">Y SERVICE</span>
  </footer>

  <!-- ♿ 접기/펼치기가 가능한 하단 접근성 설정 Floating 버튼 -->
  <div class="fixed bottom-6 right-6 z-40">
    <!-- 1. 펼침 상태 패널 -->
    <div id="a11y-fab-expanded" class="flex items-center gap-1 p-1 bg-gray-900/90 dark:bg-white/90 text-white dark:text-gray-900 rounded-2xl shadow-xl shadow-gray-900/10 dark:shadow-none backdrop-blur-md transition-all border border-white/10 dark:border-black/10">
      <button onclick="toggleA11yModal()" class="flex items-center gap-2 pl-3 pr-2 py-1.5 font-semibold text-xs hover:opacity-80 transition-opacity focus:outline-none" aria-label="웹 접근성 설정 메뉴 열기">
        <svg class="w-4 h-4 fill-current text-blue-400 dark:text-blue-600" viewBox="0 0 24 24">
          <path d="M12 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-1 6v3H8v2h3v9h2v-9h3v-2h-3V8h-2z"/>
        </svg>
        <span>접근성 설정</span>
      </button>
      <div class="w-[1px] h-4 bg-white/20 dark:bg-black/20"></div>
      <button onclick="minimizeA11yFab(true)" class="p-1.5 hover:bg-white/10 dark:hover:bg-black/10 rounded-xl transition-colors text-gray-300 dark:text-gray-600 hover:text-white dark:hover:text-black" title="버튼 최소화" aria-label="접근성 버튼 숨기기">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M19 13H5v-2h14v2z"/>
        </svg>
      </button>
    </div>

    <!-- 2. 최소화(숨김) 상태 아이콘 버튼 -->
    <button id="a11y-fab-minimized" onclick="minimizeA11yFab(false); toggleA11yModal();" class="hidden w-10 h-10 bg-gray-900/90 dark:bg-white/90 text-white dark:text-gray-900 rounded-full shadow-xl flex items-center justify-center hover:scale-110 transition-all backdrop-blur-md border border-white/10 dark:border-black/10 focus:outline-none" title="웹 접근성 설정 열기" aria-label="접근성 설정 펼치기">
      <svg class="w-5 h-5 fill-current text-blue-400 dark:text-blue-600" viewBox="0 0 24 24">
        <path d="M12 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-1 6v3H8v2h3v9h2v-9h3v-2h-3V8h-2z"/>
      </svg>
    </button>
  </div>

  <!-- ♿ 접근성 설정 모달 패널 -->
  <div id="a11y-modal" class="hidden fixed inset-0 bg-gray-950/40 dark:bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all" onclick="if(event.target===this) toggleA11yModal()">
    <div id="a11y-modal-content" class="bg-white/90 dark:bg-[#111726]/90 border border-gray-200/80 dark:border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl backdrop-blur-xl space-y-5" role="dialog" aria-modal="true" aria-labelledby="a11y-modal-title">
      <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800/80 pb-3">
        <h3 id="a11y-modal-title" class="font-bold text-sm text-gray-900 dark:text-white flex items-center gap-2">
          <svg class="w-4 h-4 fill-current text-blue-500" viewBox="0 0 24 24">
            <path d="M12 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-1 6v3H8v2h3v9h2v-9h3v-2h-3V8h-2z"/>
          </svg>
          <span>웹 접근성 설정</span>
        </h3>
        <button onclick="toggleA11yModal()" class="w-7 h-7 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-xs font-bold transition-colors" aria-label="닫기">✕</button>
      </div>

      <div class="space-y-2.5">
        <!-- 1. 고대비 모드 -->
        <button onclick="toggleA11yFeature('high-contrast')" class="w-full flex items-center justify-between p-3.5 rounded-2xl border border-gray-200/60 dark:border-gray-800 hover:bg-gray-50/80 dark:hover:bg-gray-800/40 transition-all text-left">
          <div>
            <span class="font-semibold text-xs text-gray-900 dark:text-gray-100 block">고대비 (High Contrast)</span>
            <span class="text-[11px] text-gray-400 dark:text-gray-500">배경과 텍스트의 대비를 극대화합니다</span>
          </div>
          <span id="badge-high-contrast" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-400">OFF</span>
        </button>

        <!-- 2. 큰 글씨 모드 (140% 확대) -->
        <button onclick="toggleA11yFeature('large-font')" class="w-full flex items-center justify-between p-3.5 rounded-2xl border border-gray-200/60 dark:border-gray-800 hover:bg-gray-50/80 dark:hover:bg-gray-800/40 transition-all text-left">
          <div>
            <span class="font-semibold text-xs text-gray-900 dark:text-gray-100 block">큰 글씨 확대 (140%)</span>
            <span class="text-[11px] text-gray-400 dark:text-gray-500">기본 100%에서 140%로 더욱 크게 봅니다</span>
          </div>
          <span id="badge-large-font" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-400">OFF</span>
        </button>

        <!-- 3. 애니메이션 정지 -->
        <button onclick="toggleA11yFeature('reduce-motion')" class="w-full flex items-center justify-between p-3.5 rounded-2xl border border-gray-200/60 dark:border-gray-800 hover:bg-gray-50/80 dark:hover:bg-gray-800/40 transition-all text-left">
          <div>
            <span class="font-semibold text-xs text-gray-900 dark:text-gray-100 block">애니메이션 정지</span>
            <span class="text-[11px] text-gray-400 dark:text-gray-500">모든 움직임과 핑 효과를 멈춥니다</span>
          </div>
          <span id="badge-reduce-motion" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-400">OFF</span>
        </button>

        <!-- 4. 포커스 강조 -->
        <button onclick="toggleA11yFeature('focus-highlight')" class="w-full flex items-center justify-between p-3.5 rounded-2xl border border-gray-200/60 dark:border-gray-800 hover:bg-gray-50/80 dark:hover:bg-gray-800/40 transition-all text-left">
          <div>
            <span class="font-semibold text-xs text-gray-900 dark:text-gray-100 block">키보드 포커스 강조</span>
            <span class="text-[11px] text-gray-400 dark:text-gray-500">Tab 이동 위치에 선명한 아웃라인을 띄웁니다</span>
          </div>
          <span id="badge-focus-highlight" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-400">OFF</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const STATUS_MAP = {
      operational: { 
        label: '정상 작동 중', 
        color: 'bg-emerald-500 dark:bg-emerald-400', 
        textColor: 'text-emerald-900 dark:text-emerald-300', 
        msg: '모든 시스템이 정상 작동 중입니다.' 
      },
      degraded: { 
        label: '응답 지연', 
        color: 'bg-amber-500 dark:bg-amber-400', 
        textColor: 'text-amber-900 dark:text-amber-300', 
        msg: '일부 시스템에 응답 지연이 있습니다.' 
      },
      partial_outage: { 
        label: '일부 장애', 
        color: 'bg-orange-500 dark:bg-orange-400', 
        textColor: 'text-orange-900 dark:text-orange-300', 
        msg: '일부 시스템에 장애가 발생했습니다.' 
      },
      outage: { 
        label: '전체 장애', 
        color: 'bg-rose-500 dark:bg-rose-400', 
        textColor: 'text-rose-900 dark:text-rose-300', 
        msg: '전체 시스템에 장애가 발생했습니다.' 
      }
    };

    const INCIDENT_TYPES = {
      outage: { label: '장애', badgeClass: 'bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border-rose-200 dark:border-rose-800/40' },
      maintenance: { label: '점검', badgeClass: 'bg-sky-50 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border-sky-200 dark:border-sky-800/40' },
      scheduled: { label: '예정된 점검', badgeClass: 'bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800/40' }
    };

    let allEventsData = [];
    let currentFilter = 'all';

    /* ♿ 플로팅 접근성 버튼 최소화/펼침 제어 */
    function minimizeA11yFab(isMinimize) {
      const expanded = document.getElementById('a11y-fab-expanded');
      const minimized = document.getElementById('a11y-fab-minimized');
      
      if (isMinimize) {
        expanded.classList.add('hidden');
        minimized.classList.remove('hidden');
        localStorage.setItem('a11y_fab_minimized', 'true');
      } else {
        expanded.classList.remove('hidden');
        minimized.classList.add('hidden');
        localStorage.setItem('a11y_fab_minimized', 'false');
      }
    }

    function toggleA11yModal() {
      const modal = document.getElementById('a11y-modal');
      modal.classList.toggle('hidden');
    }

    function toggleA11yFeature(featureClass) {
      const isEnabled = document.body.classList.toggle(featureClass);
      localStorage.setItem(`a11y_${featureClass}`, isEnabled);
      updateA11yBadges();
    }

    function updateA11yBadges() {
      const features = ['high-contrast', 'large-font', 'reduce-motion', 'focus-highlight'];
      features.forEach(f => {
        const badge = document.getElementById(`badge-${f}`);
        const isEnabled = document.body.classList.contains(f);
        if (badge) {
          badge.innerText = isEnabled ? 'ON' : 'OFF';
          badge.className = isEnabled 
            ? 'text-[11px] font-bold px-2 py-0.5 rounded-lg bg-blue-600 text-white' 
            : 'text-[11px] font-bold px-2 py-0.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-400';
        }
      });
    }

    function loadA11ySettings() {
      const features = ['high-contrast', 'large-font', 'reduce-motion', 'focus-highlight'];
      features.forEach(f => {
        if (localStorage.getItem(`a11y_${f}`) === 'true') {
          document.body.classList.add(f);
        }
      });
      updateA11yBadges();

      // 접근성 버튼 최소화 상태 복원
      if (localStorage.getItem('a11y_fab_minimized') === 'true') {
        minimizeA11yFab(true);
      }
    }

    async function loadData() {
      try {
        const timestamp = new Date().getTime();
        
        const [statusRes, maintenanceRes, incidentsRes] = await Promise.all([
          fetch(`status.json?t=${timestamp}`).then(r => r.ok ? r.json() : {}),
          fetch(`maintenance.json?t=${timestamp}`).then(r => r.ok ? r.json() : []),
          fetch(`incidents.json?t=${timestamp}`).then(r => r.ok ? r.json() : [])
        ]);

        const statusData = statusRes || {};
        const maintenanceData = Array.isArray(maintenanceRes) ? maintenanceRes : [];
        const incidentsData = Array.isArray(incidentsRes) ? incidentsRes : [];

        allEventsData = [...maintenanceData, ...incidentsData].sort((a, b) => (b.id || 0) - (a.id || 0));

        renderStatusAndServices(statusData);
        renderIncidents();
      } catch (e) {
        console.error('Failed to load status data:', e);
      }
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      
      ['all', 'outage', 'maintenance'].forEach(type => {
        const btn = document.getElementById(`filter-${type}`);
        if (type === filterType) {
          btn.className = "px-3 py-1 rounded-lg transition-all text-gray-900 dark:text-white bg-white dark:bg-gray-700 shadow-sm font-semibold";
        } else {
          btn.className = "px-3 py-1 rounded-lg transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white";
        }
      });

      renderIncidents();
    }

    function renderStatusAndServices(data) {
      const cfg = STATUS_MAP[data.systemState] || STATUS_MAP.operational;

      document.getElementById('status-ping').className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${cfg.color}`;
      document.getElementById('status-dot').className = `relative inline-flex rounded-full h-3 w-3 ${cfg.color}`;
      document.getElementById('status-text').innerText = cfg.msg;
      document.getElementById('status-text').className = `font-bold text-base tracking-tight ${cfg.textColor}`;
      document.getElementById('uptime-percentage').innerText = (data.uptime || '100.00') + '%';
      document.getElementById('last-updated').innerText = '최근 감지: ' + (data.lastUpdated || '-');

      const history = data.history || [];
      const servicesContainer = document.getElementById('services-container');

      servicesContainer.innerHTML = (data.services || []).map(s => {
        const statusKey = s.status || 'operational';
        
        let badgeClass = 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400 border-emerald-200/60 dark:border-emerald-800/40';
        let badgeText = '정상 작동';

        if (statusKey === 'degraded') {
          badgeClass = 'bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-400 border-amber-200/60 dark:border-amber-800/40';
          badgeText = '응답 지연';
        } else if (statusKey === 'outage') {
          badgeClass = 'bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-400 border-rose-200/60 dark:border-rose-800/40';
          badgeText = '접속 불가';
        }

        const recentHistory = history.slice(-30);
        let barsHtml = '';
        
        const fillCount = Math.max(0, 30 - recentHistory.length);
        for(let i=0; i<fillCount; i++) {
          barsHtml += `<div class="bar-item bg-emerald-500/80 dark:bg-emerald-400/80" title="정상"></div>`;
        }

        recentHistory.forEach(h => {
          const match = (h.services || []).find(item => item.name === s.name);
          const st = match ? match.status : 'operational';
          let colorClass = 'bg-emerald-500 dark:bg-emerald-400';
          let titleText = '정상';

          if (st === 'degraded') {
            colorClass = 'bg-amber-500 dark:bg-amber-400';
            titleText = '지연';
          } else if (st === 'outage') {
            colorClass = 'bg-rose-500 dark:bg-rose-400';
            titleText = '장애';
          }

          barsHtml += `<div class="bar-item ${colorClass}" title="${titleText}"></div>`;
        });

        return `
          <div class="bg-white/70 dark:bg-[#111726]/70 p-5 rounded-2xl border border-gray-200/70 dark:border-gray-800/80 shadow-sm backdrop-blur-xl space-y-3" role="article" aria-label="${s.name} 서비스 상태 정보">
            <div class="flex items-center justify-between">
              <span class="font-semibold text-sm text-gray-900 dark:text-gray-100">${s.name}</span>
              <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border ${badgeClass}">
                ${badgeText}
              </span>
            </div>
            
            <div class="flex gap-1 items-center pt-1" aria-hidden="true">
              ${barsHtml}
            </div>
            
            <div class="flex justify-between text-[11px] text-gray-400 dark:text-gray-500">
              <span>응답 속도 (미국서버 기준): <strong class="text-gray-700 dark:text-gray-300 font-semibold">${s.latency || 0}ms</strong></span>
              <span class="text-gray-600 dark:text-gray-400 font-semibold">${s.uptime || '100.00'}% Uptime</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderIncidents() {
      const incContainer = document.getElementById('incidents-container');
      
      const filtered = allEventsData.filter(item => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'outage') return item.type === 'outage';
        if (currentFilter === 'maintenance') return item.type === 'maintenance' || item.type === 'scheduled';
        return true;
      });

      if (filtered && filtered.length > 0) {
        incContainer.innerHTML = filtered.map(item => {
          const typeInfo = INCIDENT_TYPES[item.type] || INCIDENT_TYPES.outage;
          return `
            <div class="bg-white/70 dark:bg-[#111726]/70 p-4 rounded-2xl border border-gray-200/70 dark:border-gray-800/80 shadow-sm backdrop-blur-xl space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${typeInfo.badgeClass}">${typeInfo.label}</span>
                  <h3 class="font-semibold text-xs text-gray-900 dark:text-gray-100">${item.title}</h3>
                </div>
                <span class="text-[11px] text-gray-400 dark:text-gray-500">${item.time}</span>
              </div>
              <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">${item.text}</p>
            </div>
          `;
        }).join('');
      } else {
        const filterLabel = currentFilter === 'outage' ? '장애' : currentFilter === 'maintenance' ? '점검' : '';
        incContainer.innerHTML = `
          <div class="text-center py-8 text-xs text-gray-400 dark:text-gray-600 bg-white/40 dark:bg-[#111726]/40 rounded-2xl border border-gray-200/70 dark:border-gray-800/80">
            기록된 ${filterLabel} 내역이 없습니다.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadA11ySettings();
      loadData();
    });
  </script>
</body>
</html>
