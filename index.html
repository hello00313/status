<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y SERVICE STATUS</title>
  
  <!-- Pretendard & Inter 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media', // OS 다크/라이트 모드 자동 감지
    }
  </script>

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      letter-spacing: -0.01em;
    }
    .font-num {
      font-family: 'Inter', "Pretendard Variable", sans-serif;
    }
    .bar-item {
      flex: 1;
      height: 20px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .bar-item:hover {
      transform: scaleY(1.2);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#0B0F17] text-gray-900 dark:text-gray-100 antialiased min-h-screen font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-200">

  <div class="max-w-2xl mx-auto w-full px-5 py-12">
    <!-- Header -->
    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-gray-900 dark:bg-white text-white dark:text-gray-950 font-bold flex items-center justify-center text-sm shadow">
          Y
        </div>
        <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white">Y SERVICES STATUS</h1>
      </div>
      <a href="https://yhn.kr" target="_blank" class="text-xs font-medium text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-gray-200 transition-colors flex items-center gap-1">
        yhn.kr 방문 &rarr;
      </a>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="p-6 rounded-2xl border transition-all duration-300 mb-10 bg-white/80 dark:bg-[#121824]/80 border-gray-200/80 dark:border-gray-800/80 shadow-sm backdrop-blur-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="relative flex h-3 w-3">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3"></span>
          </span>
          <span id="status-text" class="font-bold text-base tracking-tight"></span>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-gray-400 dark:text-gray-500 block font-medium">전체 가동률</span>
          <span id="uptime-percentage" class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 font-num">100.0%</span>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800/60 flex justify-between items-center text-[11px] text-gray-400 dark:text-gray-500 font-num">
        <span id="last-updated">최근 점검 확인 중...</span>
        <span>5분 간격 자동 체크</span>
      </div>
    </div>

    <!-- Services Section -->
    <section class="mb-10">
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">서비스별 상태</h2>
      </div>
      <div id="services-container" class="space-y-4"></div>
    </section>

    <!-- Incident Log -->
    <section>
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">점검 및 장애 이력</h2>
      </div>
      <div id="incidents-container" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const STATUS_MAP = {
      operational: { label: '정상 작동 중', color: 'bg-emerald-500 dark:bg-emerald-400', textColor: 'text-emerald-900 dark:text-emerald-300', msg: '모든 시스템이 정상 작동 중입니다.' },
      outage: { label: '서비스 장애', color: 'bg-rose-500 dark:bg-rose-400', textColor: 'text-rose-900 dark:text-rose-300', msg: '일부 서비스에 응답 지연이 있습니다.' }
    };

    const INCIDENT_TYPES = {
      outage: { label: '장애', badgeClass: 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 border-rose-200 dark:border-rose-800/40' },
      maintenance: { label: '점검', badgeClass: 'bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300 border-sky-200 dark:border-sky-800/40' },
      scheduled: { label: '예정된 점검', badgeClass: 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800/40' }
    };

    async function loadData() {
      try {
        const timestamp = new Date().getTime();
        
        // 3개의 JSON 파일(상태, 점검, 장애)을 병렬 수신
        const [statusRes, maintenanceRes, incidentsRes] = await Promise.all([
          fetch(`status.json?t=${timestamp}`).then(r => r.ok ? r.json() : {}),
          fetch(`maintenance.json?t=${timestamp}`).then(r => r.ok ? r.json() : []),
          fetch(`incidents.json?t=${timestamp}`).then(r => r.ok ? r.json() : [])
        ]);

        const statusData = statusRes || {};
        const maintenanceData = Array.isArray(maintenanceRes) ? maintenanceRes : [];
        const incidentsData = Array.isArray(incidentsRes) ? incidentsRes : [];

        // 점검 내역과 장애 내역 합치기 (최신순 정렬)
        const allEvents = [...maintenanceData, ...incidentsData].sort((a, b) => (b.id || 0) - (a.id || 0));

        render(statusData, allEvents);
      } catch (e) {
        console.error('Failed to load status data:', e);
      }
    }

    function render(data, incidents) {
      const cfg = STATUS_MAP[data.systemState] || STATUS_MAP.operational;

      document.getElementById('status-ping').className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${cfg.color}`;
      document.getElementById('status-dot').className = `relative inline-flex rounded-full h-3 w-3 ${cfg.color}`;
      document.getElementById('status-text').innerText = cfg.msg;
      document.getElementById('status-text').className = `font-bold text-base tracking-tight ${cfg.textColor}`;
      document.getElementById('uptime-percentage').innerText = (data.uptime || '100.00') + '%';
      document.getElementById('last-updated').innerText = '최근 감지: ' + (data.lastUpdated || '-');

      const history = data.history || [];
      const servicesContainer = document.getElementById('services-container');

      servicesContainer.innerHTML = (data.services || []).map(s => {
        const isUp = s.status === 'operational';
        const recentHistory = history.slice(-30);
        let barsHtml = '';
        
        const fillCount = Math.max(0, 30 - recentHistory.length);
        for(let i=0; i<fillCount; i++) {
          barsHtml += `<div class="bar-item bg-emerald-500/80 dark:bg-emerald-400/80" title="정상"></div>`;
        }

        recentHistory.forEach(h => {
          const match = (h.services || []).find(item => item.name === s.name);
          const status = match ? match.status : 'operational';
          const colorClass = status === 'operational' ? 'bg-emerald-500 dark:bg-emerald-400' : 'bg-rose-500 dark:bg-rose-400';
          barsHtml += `<div class="bar-item ${colorClass}" title="${status === 'operational' ? '정상' : '장애'}"></div>`;
        });

        return `
          <div class="bg-white/80 dark:bg-[#121824]/80 p-5 rounded-2xl border border-gray-200/80 dark:border-gray-800/80 shadow-sm backdrop-blur-xl space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-semibold text-sm text-gray-900 dark:text-gray-100">${s.name}</span>
              <span class="text-xs font-medium px-2.5 py-0.5 rounded-full font-num ${isUp ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/40' : 'bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-400 border border-rose-200/60 dark:border-rose-800/40'}">
                ${isUp ? 'Operational' : 'Down'}
              </span>
            </div>
            
            <div class="flex gap-1 items-center pt-1">
              ${barsHtml}
            </div>
            
            <div class="flex justify-between text-[11px] text-gray-400 dark:text-gray-500 font-num">
              <span>최근 30회 기록</span>
              <span class="text-gray-600 dark:text-gray-400 font-medium">${data.uptime || '100.00'}% Uptime</span>
            </div>
          </div>
        `;
      }).join('');

      const incContainer = document.getElementById('incidents-container');
      if (incidents && incidents.length > 0) {
        incContainer.innerHTML = incidents.map(item => {
          const typeInfo = INCIDENT_TYPES[item.type] || INCIDENT_TYPES.outage;
          return `
            <div class="bg-white/80 dark:bg-[#121824]/80 p-4 rounded-xl border border-gray-200/80 dark:border-gray-800/80 shadow-sm space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${typeInfo.badgeClass}">${typeInfo.label}</span>
                  <h3 class="font-semibold text-xs text-gray-900 dark:text-gray-100">${item.title}</h3>
                </div>
                <span class="text-[11px] font-num text-gray-400 dark:text-gray-500">${item.time}</span>
              </div>
              <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">${item.text}</p>
            </div>
          `;
        }).join('');
      } else {
        incContainer.innerHTML = `
          <div class="text-center py-8 text-xs text-gray-400 dark:text-gray-600 bg-white/40 dark:bg-[#121824]/40 rounded-xl border border-gray-200/80 dark:border-gray-800/80">
            최근 기록된 장애 및 점검 내역이 없습니다.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
