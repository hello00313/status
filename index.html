<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yhn.kr Status</title>
  
  <!-- Pretendard & Inter 폰트 불러오기 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      letter-spacing: -0.01em;
    }
    .font-num {
      font-family: 'Inter', "Pretendard Variable", sans-serif;
    }
    .bar-item {
      flex: 1;
      height: 20px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .bar-item:hover {
      transform: scaleY(1.2);
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 antialiased min-h-screen">

  <div class="max-w-2xl mx-auto w-full px-6 py-16">
    <!-- Header -->
    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-lg shadow-indigo-500/30">
          Y
        </div>
        <h1 class="text-lg font-bold tracking-tight text-white">yhn.kr status</h1>
      </div>
      <a href="https://yhn.kr" target="_blank" class="text-xs font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-1">
        yhn.kr 방문 &rarr;
      </a>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="p-6 rounded-2xl border transition-all duration-300 mb-10 bg-slate-900/60 border-slate-800 backdrop-blur-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="relative flex h-3 w-3">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3"></span>
          </span>
          <span id="status-text" class="font-bold text-base"></span>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-slate-400 block font-medium">전체 가동률</span>
          <span id="uptime-percentage" class="text-xl font-extrabold text-emerald-400 font-num">100.0%</span>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center text-[11px] text-slate-400 font-num">
        <span id="last-updated">최근 점검 확인 중...</span>
        <span>5분 간격 자동 체크</span>
      </div>
    </div>

    <!-- Services Section -->
    <section class="mb-10">
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">서비스별 상태</h2>
      </div>
      <div id="services-container" class="space-y-4"></div>
    </section>

    <!-- Incident Log -->
    <section>
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">점검 및 장애 이력</h2>
      </div>
      <div id="incidents-container" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const STATUS_MAP = {
      operational: { label: '정상 작동 중', color: 'bg-emerald-500', msg: '모든 시스템이 정상 작동 중입니다.' },
      outage: { label: '서비스 장애', color: 'bg-rose-500', msg: '일부 서비스에 응답 지연이 있습니다.' }
    };

    const INCIDENT_TYPES = {
      outage: { label: '장애', badgeClass: 'bg-rose-500/10 text-rose-400 border-rose-500/20' },
      maintenance: { label: '점검', badgeClass: 'bg-sky-500/10 text-sky-400 border-sky-500/20' },
      scheduled: { label: '예정된 점검', badgeClass: 'bg-amber-500/10 text-amber-400 border-amber-500/20' }
    };

    async function loadData() {
      try {
        const res = await fetch('status.json?t=' + new Date().getTime());
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error('Failed to load status:', e);
      }
    }

    function render(data) {
      const cfg = STATUS_MAP[data.systemState] || STATUS_MAP.operational;

      document.getElementById('status-ping').className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${cfg.color}`;
      document.getElementById('status-dot').className = `relative inline-flex rounded-full h-3 w-3 ${cfg.color}`;
      document.getElementById('status-text').innerText = cfg.msg;
      document.getElementById('uptime-percentage').innerText = (data.uptime || '100.00') + '%';
      document.getElementById('last-updated').innerText = '최근 감지: ' + (data.lastUpdated || '-');

      const history = data.history || [];
      const servicesContainer = document.getElementById('services-container');

      servicesContainer.innerHTML = (data.services || []).map(s => {
        const isUp = s.status === 'operational';
        const recentHistory = history.slice(-30);
        let barsHtml = '';
        
        const fillCount = Math.max(0, 30 - recentHistory.length);
        for(let i=0; i<fillCount; i++) {
          barsHtml += `<div class="bar-item bg-emerald-500/80" title="정상"></div>`;
        }

        recentHistory.forEach(h => {
          const match = (h.services || []).find(item => item.name === s.name);
          const status = match ? match.status : 'operational';
          const colorClass = status === 'operational' ? 'bg-emerald-500' : 'bg-rose-500';
          barsHtml += `<div class="bar-item ${colorClass}" title="${status === 'operational' ? '정상' : '장애'}"></div>`;
        });

        return `
          <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800/80 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-semibold text-sm text-slate-100">${s.name}</span>
              <span class="text-xs font-medium px-2.5 py-0.5 rounded-full font-num ${isUp ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                ${isUp ? 'Operational' : 'Down'}
              </span>
            </div>
            
            <div class="flex gap-1 items-center pt-1">
              ${barsHtml}
            </div>
            
            <div class="flex justify-between text-[11px] text-slate-500 font-num">
              <span>최근 30회 기록</span>
              <span class="text-slate-400 font-medium">99.9% Uptime</span>
            </div>
          </div>
        `;
      }).join('');

      const incContainer = document.getElementById('incidents-container');
      if (data.incidents && data.incidents.length > 0) {
        incContainer.innerHTML = data.incidents.map(item => {
          const typeInfo = INCIDENT_TYPES[item.type] || INCIDENT_TYPES.outage;
          return `
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800/80 space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${typeInfo.badgeClass}">${typeInfo.label}</span>
                  <h3 class="font-semibold text-xs text-slate-200">${item.title}</h3>
                </div>
                <span class="text-[11px] font-num text-slate-500">${item.time}</span>
              </div>
              <p class="text-xs text-slate-400 leading-relaxed">${item.text}</p>
            </div>
          `;
        }).join('');
      } else {
        incContainer.innerHTML = `
          <div class="text-center py-8 text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800/50">
            최근 기록된 장애 및 점검 내역이 없습니다.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
