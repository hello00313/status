<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yhn.kr Status</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; }
    .bar-item { flex: 1; height: 24px; border-radius: 3px; transition: all 0.2s; }
    .bar-item:hover { transform: scaleY(1.15); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased min-h-screen font-sans">

  <div class="max-w-3xl mx-auto w-full px-5 py-12">
    <!-- Header -->
    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold flex items-center justify-center text-sm shadow">
          Y
        </div>
        <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white">yhn.kr</h1>
      </div>
      <a href="https://yhn.kr" target="_blank" class="text-xs font-medium text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-colors">
        yhn.kr &rarr;
      </a>
    </header>

    <!-- Global Status & Overall Uptime Banner -->
    <div id="status-banner" class="p-6 rounded-2xl border transition-all duration-300 mb-10 shadow-sm backdrop-blur-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="relative flex h-3 w-3">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3"></span>
          </span>
          <span id="status-text" class="font-bold text-base tracking-tight"></span>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400 block font-medium">전체 가동률</span>
          <span id="uptime-percentage" class="text-lg font-extrabold text-green-600 dark:text-green-400 font-mono">100.0%</span>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-200/40 dark:border-gray-800/40 flex justify-between items-center text-[11px] text-gray-400 font-mono">
        <span id="last-updated">최근 점검: 불러오는 중...</span>
        <span>주기: 5분 간격 자동 체크</span>
      </div>
    </div>

    <!-- Services with History Bars -->
    <section class="mb-12">
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">서비스별 가동 상태</h2>
      </div>
      <div id="services-container" class="space-y-4"></div>
    </section>

    <!-- Incident History Timeline -->
    <section>
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">장애 및 점검 기록</h2>
      </div>
      <div id="incidents-container" class="space-y-3"></div>
    </section>
  </div>

  <script>
    const STATUS_MAP = {
      operational: { label: '정상 작동 중', color: 'bg-green-500', bannerBg: 'bg-green-50 dark:bg-green-950/30', bannerBorder: 'border-green-200 dark:border-green-900', textColor: 'text-green-900 dark:text-green-300', msg: '모든 시스템이 정상 작동 중입니다.' },
      outage: { label: '서비스 장애', color: 'bg-red-500', bannerBg: 'bg-red-50 dark:bg-red-950/30', bannerBorder: 'border-red-200 dark:border-red-900', textColor: 'text-red-900 dark:text-red-300', msg: '일부 서비스에 장애가 발생했습니다.' }
    };

    const INCIDENT_TYPES = {
      outage: { label: '장애', badgeClass: 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300' },
      maintenance: { label: '점검', badgeClass: 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-300' },
      scheduled: { label: '예정된 점검', badgeClass: 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300' }
    };

    async function loadData() {
      try {
        const res = await fetch('status.json?t=' + new Date().getTime());
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error('Failed to load status:', e);
      }
    }

    function render(data) {
      const cfg = STATUS_MAP[data.systemState] || STATUS_MAP.operational;

      // Banner & Overall Uptime
      const banner = document.getElementById('status-banner');
      banner.className = `p-6 rounded-2xl border transition-all duration-300 mb-10 shadow-sm backdrop-blur-md ${cfg.bannerBg} ${cfg.bannerBorder}`;
      document.getElementById('status-ping').className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${cfg.color}`;
      document.getElementById('status-dot').className = `relative inline-flex rounded-full h-3 w-3 ${cfg.color}`;
      document.getElementById('status-text').innerText = cfg.msg;
      document.getElementById('status-text').className = `font-bold text-base tracking-tight ${cfg.textColor}`;
      document.getElementById('uptime-percentage').innerText = (data.uptime || '100.00') + '%';
      document.getElementById('last-updated').innerText = '최근 감지: ' + (data.lastUpdated || '-');

      // Render Services with Bars
      const history = data.history || [];
      const servicesContainer = document.getElementById('services-container');

      servicesContainer.innerHTML = (data.services || []).map(s => {
        const isUp = s.status === 'operational';
        
        // 최근 30개 체크 상태 바 생성
        const recentHistory = history.slice(-30);
        let barsHtml = '';
        
        // 데이터가 부족할 경우 정상 바 채우기
        const fillCount = Math.max(0, 30 - recentHistory.length);
        for(let i=0; i<fillCount; i++) {
          barsHtml += `<div class="bar-item bg-green-500 opacity-80" title="정상"></div>`;
        }

        recentHistory.forEach(h => {
          const match = (h.services || []).find(item => item.name === s.name);
          const status = match ? match.status : 'operational';
          const colorClass = status === 'operational' ? 'bg-green-500' : 'bg-red-500';
          const title = status === 'operational' ? '정상' : '장애 감지';
          barsHtml += `<div class="bar-item ${colorClass}" title="${title}"></div>`;
        });

        return `
          <div class="bg-white dark:bg-gray-900 p-5 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-gray-900 dark:text-gray-100">${s.name}</span>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${isUp ? 'bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-400' : 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-400'}">
                ${isUp ? '정상' : '장애'}
              </span>
            </div>
            
            <!-- Better Stack Style Status Bars -->
            <div class="flex gap-1 items-center pt-1">
              ${barsHtml}
            </div>
            
            <div class="flex justify-between text-[11px] text-gray-400 font-mono">
              <span>최근 30회 모니터링 기록</span>
              <span class="text-green-600 dark:text-green-400 font-bold">100% 가동</span>
            </div>
          </div>
        `;
      }).join('');

      // Render Incidents
      const incContainer = document.getElementById('incidents-container');
      if (data.incidents && data.incidents.length > 0) {
        incContainer.innerHTML = data.incidents.map(item => {
          const typeInfo = INCIDENT_TYPES[item.type] || INCIDENT_TYPES.outage;
          return `
            <div class="bg-white dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm space-y-1.5">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded ${typeInfo.badgeClass}">${typeInfo.label}</span>
                  <h3 class="font-semibold text-xs text-gray-900 dark:text-gray-100">${item.title}</h3>
                </div>
                <span class="text-[11px] font-mono text-gray-400">${item.time}</span>
              </div>
              <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed pl-1">${item.text}</p>
            </div>
          `;
        }).join('');
      } else {
        incContainer.innerHTML = `
          <div class="text-center py-6 text-xs text-gray-400 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800">
            기록된 장애 및 점검 내역이 없습니다.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
